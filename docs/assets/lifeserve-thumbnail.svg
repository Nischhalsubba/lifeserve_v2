<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">LifeServe V2 website thumbnail</title><desc id="d">A warm nonprofit and community-service website concept.</desc><rect width="1200" height="630" fill="#edf8f4"/><circle cx="1060" cy="80" r="250" fill="#14b8a6" opacity=".16"/><g transform="translate(66 72)"><text fill="#0f766e" font-family="Arial" font-size="15" font-weight="900" letter-spacing="5">SERVICE / COMMUNITY / ACTION</text><text y="90" fill="#153a35" font-family="Arial" font-size="72" font-weight="900">LifeServe V2</text><text y="142" fill="#57716c" font-family="Arial" font-size="23">Programs, volunteering, support, and trust.</text><rect y="198" width="178" height="56" rx="28" fill="#0f766e"/><text x="89" y="232" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="900">GET INVOLVED</text><g transform="translate(0 320)" font-family="Arial"><text fill="#0f766e" font-size="13" font-weight="900">MISSION FIRST</text><text y="44" fill="#153a35" font-size="26" font-weight="900">Make help easier to find.</text><text y="82" fill="#57716c" font-size="17">Clear programs, current events, and direct action paths.</text></g></g><g transform="translate(620 70)" font-family="Arial"><rect width="510" height="490" rx="28" fill="#fff"/><rect x="28" y="28" width="454" height="160" rx="20" fill="#cdeee6"/><circle cx="110" cy="108" r="46" fill="#0f766e"/><path d="M88 108 h44 M110 86 v44" stroke="#fff" stroke-width="10" stroke-linecap="round"/><text x="180" y="94" fill="#153a35" font-size="25" font-weight="900">Community services</text><text x="180" y="126" fill="#57716c" font-size="15">Practical information and support.</text><g transform="translate(28 216)"><rect width="214" height="100" rx="18" fill="#fff4d8"/><text x="20" y="40" fill="#153a35" font-size="20" font-weight="900">Volunteer</text><text x="20" y="70" fill="#57716c" font-size="14">Join local programs</text><rect x="240" width="214" height="100" rx="18" fill="#e5e7ff"/><text x="260" y="40" fill="#153a35" font-size="20" font-weight="900">Events</text><text x="260" y="70" fill="#57716c" font-size="14">See what is happening</text><rect y="124" width="454" height="100" rx="18" fill="#e9f7ef"/><text x="20" y="164" fill="#153a35" font-size="20" font-weight="900">Donate or contact</text><text x="20" y="194" fill="#57716c" font-size="14">One direct path from interest to support.</text></g></g><text x="1124" y="604" text-anchor="end" fill="#61817a" font-family="Arial" font-size="12" font-weight="800" letter-spacing="3">NISCHHALSUBBA / LIFESERVE-V2</text></svg>